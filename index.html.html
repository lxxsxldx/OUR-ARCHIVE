/* =========================================================
   오늘의 기록 — 감성 일기 (Supabase 연동 SPA, vanilla JS)

/* ---------------- Supabase 설정 ---------------- */
const SUPABASE_URL = 'https://mnsqolfpcrgebyglumhn.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ilQa7jVU9PHGY8Jx88I-Xw_K6t5hOch';
const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const ENTRIES_TABLE = 'logs';

function newId(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random()*16|0, v = c==='x'?r:(r&0x3|0x8);
    return v.toString(16);
  });
}

/* entry(앱 형식) <-> row(DB 형식) 매핑 */
function entryToRow(e, userId){
  return {
    id: e.id,
    user_id: userId,
    date: e.date,
    title: e.title || '',
    content: e.content || '',
    mood: e.mood || null,
    weather: e.weather || null,
    tags: e.tags || [],
    images: e.images || [],
    created_at: e.createdAt,
    updated_at: e.updatedAt,
  };
}
function rowToEntry(r){
  return {
    id: r.id,
    date: r.date,
    title: r.title || '',
    content: r.content || '',
    mood: r.mood || '',
    weather: r.weather || '',
    tags: r.tags || [],
    images: r.images || [],
    createdAt: r.created_at,
    updatedAt: r.updated_at,
  };
}

/* ---------------- 데이터 계층 (Supabase + localStorage 하이브리드) ---------------- */
const DB = (() => {
  const K_DRAFT = 'diary_draft_v1';
  const K_THEME = 'diary_theme_v1';
  const K_SEEDED = 'diary_seeded_v1';

  async function ensureAuth(){
    const { data: { session } } = await sbClient.auth.getSession();
    if(session && session.user) return session.user;
    const { data, error } = await sbClient.auth.signInAnonymously();
    if(error) throw error;
    return data.user;
  }

  async function fetchEntries(userId){
    const { data, error } = await sbClient
      .from(ENTRIES_TABLE)
      .select('*')
      .eq('user_id', userId)
      .order('date', { ascending:false });
    if(error) throw error;
    return (data||[]).map(rowToEntry);
  }

  async function insertEntry(entry, userId){
    const row = entryToRow(entry, userId);
    const { data, error } = await sbClient.from(ENTRIES_TABLE).insert(row).select().single();
    if(error) throw error;
    return rowToEntry(data);
  }

  async function updateEntry(entry, userId){
    const row = entryToRow(entry, userId);
    delete row.id;
    const { data, error } = await sbClient.from(ENTRIES_TABLE).update(row).eq('id', entry.id).select().single();
    if(error) throw error;
    return rowToEntry(data);
  }

  async function deleteEntry(id){
    const { error } = await sbClient.from(ENTRIES_TABLE).delete().eq('id', id);
    if(error) throw error;
  }

  function hasSeeded(){ return !!localStorage.getItem(K_SEEDED); }
  function markSeeded(){ localStorage.setItem(K_SEEDED, '1'); }

  function getDraft(){
    try{
      const raw = localStorage.getItem(K_DRAFT);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }
  function saveDraft(d){ localStorage.setItem(K_DRAFT, JSON.stringify(d)); }
  function clearDraft(){ localStorage.removeItem(K_DRAFT); }
  function getTheme(){ return localStorage.getItem(K_THEME) || 'light'; }
  function setTheme(t){ localStorage.setItem(K_THEME, t); }

  return {
    ensureAuth, fetchEntries, insertEntry, updateEntry, deleteEntry,
    hasSeeded, markSeeded,
    getDraft, saveDraft, clearDraft, getTheme, setTheme,
  };
})();

function moodOf(key){ return MOODS.find(m => m.key === key); }
function weatherOf(key){ return WEATHERS.find(w => w.key === key); }
function pad2(n){ return String(n).padStart(2,'0'); }
function toDateStr(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function todayStr(){ return toDateStr(new Date()); }
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MONTH_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WEEKDAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const WEEKDAY_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function formatDateKR(dateStr, withDay){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return (withDay===false ? '' : `${WEEKDAY_NAMES[dt.getDay()]}, `) + `${MONTH_NAMES[m-1]} ${d}, ${y}`;
}
function formatDateTimeKR(iso){
  const dt = new Date(iso);
  let h = dt.getHours();
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return `${MONTH_SHORT[dt.getMonth()]} ${dt.getDate()}, ${h}:${pad2(dt.getMinutes())} ${ampm}`;
}
function truncate(str, n){
  if(!str) return '';
  const clean = str.replace(/\n+/g,' ').trim();
  return clean.length > n ? clean.slice(0,n) + '…' : clean;
}
function debounce(fn, ms){
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(()=>fn(...args), ms); };
}
function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}
function highlightText(str, term){
  const esc = escapeHtml(str);
  if(!term) return esc;
  try{
    const re = new RegExp('(' + term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
    return esc.replace(re, '<mark style="background:var(--accent-yellow); border-radius:4px; padding:0 2px;">$1</mark>');
  }catch(e){ return esc; }
}

  const sample = [
    {

      mood:'calm', weather:'cloudy', tags:['walk','daily','evening'], images:[],

      id: newId(), date: d(2), title:'Seeing an old friend',

      content:"Everything kept piling up and I felt rushed all day. Things didn't go as planned and I was a little disappointed in myself, but I still want to give myself credit for pushing through to the end. Tomorrow I'll try to plan with a bit more breathing room.",
      mood:'down', weather:'rainy', tags:['work','resolve'], images:[],
      createdAt: new Date(now-5*864e5).toISOString(), updatedAt: new Date(now-5*864e5).toISOString(),
    },
    {

      mood:'calm', weather:'rainy', tags:['reading','music','rest'], images:[],
      createdAt: new Date(now-9*864e5).toISOString(), updatedAt: new Date(now-9*864e5).toISOString(),
    },
    {
      id: newId(), date: d(13), title:'A small win',

  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal-box fade-in">
        <h3 class="font-hand text-2xl mb-2" style="color:var(--text)">${escapeHtml(title)}</h3>

        </div>
      </div>
    </div>`;
  requestAnimationFrame(()=> document.getElementById('modal-overlay').classList.add('show'));
  const close = () => {
    document.getElementById('modal-overlay').classList.remove('show');
    setTimeout(()=> root.innerHTML = '', 200);
  };
  document.getElementById('modal-cancel').onclick = close;
  document.getElementById('modal-overlay').onclick = (e) => { if(e.target.id === 'modal-overlay') close(); };
  document.getElementById('modal-confirm').onclick = () => { onConfirm && onConfirm(); close(); };
}

/* ---------------- 부팅 화면 (인증 + 최초 데이터 로딩) ---------------- */
function renderBoot(){
  const app = document.getElementById('app');
  if(state.bootError){
    app.innerHTML = `
      <div class="flex flex-col items-center justify-center text-center px-6" style="min-height:100vh; color:var(--text);">
        <p class="text-3xl mb-3">⚠️</p>
        <p class="font-hand text-xl mb-2">연결에 실패했어요</p>
        <p class="text-sm mb-6" style="color:var(--text-muted); max-width:360px;">${escapeHtml(state.bootError)}</p>
        <button id="boot-retry" class="btn-primary">다시 시도</button>
      </div>`;
    document.getElementById('boot-retry').addEventListener('click', boot);
    return;
  }
  app.innerHTML = `
    <div class="flex flex-col items-center justify-center gap-3" style="min-height:100vh; color:var(--text);">
      <p class="text-3xl">🌿</p>
      <p class="font-hand text-lg" style="color:var(--text-muted)">기록을 불러오는 중…</p>
    </div>`;
}

async function boot(){
  state.booting = true;
  state.bootError = null;
  renderBoot();
  try{
    const user = await DB.ensureAuth();
    state.userId = user.id;
    let entries = await DB.fetchEntries(user.id);
    if(entries.length === 0 && !DB.hasSeeded()){
      entries = await seedSampleData(user.id);
      DB.markSeeded();
    }
    state.entries = entries;
    state.booting = false;
    renderApp();
  }catch(err){
    console.error(err);
    state.booting = false;
    state.bootError = (err && err.message) ? err.message : '알 수 없는 오류가 발생했어요.';
    renderBoot();
  }
}

/* ---------------- 라우터 ---------------- */
function renderApp(){
  if(state.booting || state.bootError){ renderBoot(); return; }
  if(state.view === 'home') return renderHome();
  if(state.view === 'write') return renderWrite();
  if(state.view === 'list') return renderList();
  if(state.view === 'detail') return renderDetail();
  if(state.view === 'stats') return renderStats();
  renderHome();
}

      ${e.images && e.images.length ? `<div class="mt-3 flex gap-1">${e.images.slice(0,3).map(img=>`<img src="${img}" class="w-10 h-10 rounded-lg object-cover" style="border:1px solid var(--border-soft);"/>`).join('')}</div>`:''}
    </div>
  `;
}

/* ============================================================
   일기 쓰기
   ============================================================ */
function beginWrite(entryId){
  if(entryId){
    const src = state.entries.find(e=>e.id===entryId);
    if(!src){ nav('list'); return; }
    state.draft = JSON.parse(JSON.stringify(src));
    state.isEditing = true;
    nav('write');
    return;
  }
  const savedDraft = DB.getDraft();
  const startFresh = () => {
    state.draft = {
      id: newId(), date: todayStr(), title:'', content:'',
      mood: state.quickMood || '', weather:'', tags:[], images:[],
      createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(),
    };
    state.isEditing = false;
    nav('write');
  };
  if(savedDraft && (savedDraft.title || savedDraft.content)){
    showModal({
      title:'임시 저장된 기록이 있어요',
      body:'이전에 작성하다 만 일기를 불러올까요? "새로 쓰기"를 선택하면 임시 저장 내용은 사라져요.',
      confirmLabel:'불러오기',
      onConfirm: () => { state.draft = savedDraft; state.isEditing = false; nav('write'); }
    });
    // add a lightweight secondary action via toast-style hint
    setTimeout(() => {
      const box = document.querySelector('.modal-box');
      if(box && !box.querySelector('#fresh-btn')){
        const p = document.createElement('button');
        p.id = 'fresh-btn';
        p.className = 'text-xs mt-3';
        p.style.color = 'var(--text-muted)';
        p.textContent = '아니요, 새로 쓸게요';
        p.onclick = () => { document.getElementById('modal-cancel').click(); DB.clearDraft(); startFresh(); };
        box.appendChild(p);
      }
    }, 30);
  } else {
    startFresh();
  }
}

function tagChipHtml(t){
  return `<span class="chip" data-tag="${escapeHtml(t)}">#${escapeHtml(t)} <button data-remove-tag="${escapeHtml(t)}">×</button></span>`;
}
function thumbHtml(img, i){
  return `<div class="thumb"><img src="${img}"/><button class="rm" data-remove-image="${i}">×</button></div>`;
}

function wireWritePage(){
  const d = state.draft;
  const titleEl = document.getElementById('w-title');
  const contentEl = document.getElementById('w-content');
  const charCountEl = document.getElementById('char-count');
  const autosaveLabel = document.getElementById('autosave-label');

  const updateCharCount = () => { charCountEl.textContent = (contentEl.value.length) + '자'; };
  updateCharCount();

  const doAutosave = debounce(() => {
    DB.saveDraft(d);
    autosaveLabel.textContent = '자동 저장됨 · ' + pad2(new Date().getHours()) + ':' + pad2(new Date().getMinutes());
  }, 900);

  titleEl.addEventListener('input', () => { d.title = titleEl.value; doAutosave(); });
  contentEl.addEventListener('input', () => { d.content = contentEl.value; updateCharCount(); doAutosave(); });

  document.querySelectorAll('#w-mood-row [data-mood]').forEach(btn => {
    btn.addEventListener('click', () => {
      d.mood = d.mood === btn.getAttribute('data-mood') ? '' : btn.getAttribute('data-mood');
      document.querySelectorAll('#w-mood-row .mood-pick').forEach(b => b.classList.toggle('selected', b.getAttribute('data-mood')===d.mood));
      doAutosave();
    });
  });
  document.querySelectorAll('#w-weather-row [data-weather]').forEach(btn => {
    btn.addEventListener('click', () => {
      d.weather = d.weather === btn.getAttribute('data-weather') ? '' : btn.getAttribute('data-weather');
      document.querySelectorAll('#w-weather-row .weather-pick').forEach(b => b.classList.toggle('selected', b.getAttribute('data-weather')===d.weather));
      doAutosave();
    });
  });

  const tagInput = document.getElementById('w-tag-input');
  const tagList = document.getElementById('w-tags-list');
  function addTag(raw){
    const t = raw.trim().replace(/^#/,'');
    if(!t) return;
    if(d.tags.includes(t)){ tagInput.value=''; return; }
    d.tags.push(t);
    tagList.insertAdjacentHTML('beforeend', tagChipHtml(t));
    tagInput.value = '';
    wireTagRemovers();
    doAutosave();
  }
  tagInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' || e.key === ','){ e.preventDefault(); addTag(tagInput.value); }
  });
  function wireTagRemovers(){
    tagList.querySelectorAll('[data-remove-tag]').forEach(btn => {
      btn.onclick = () => {
        const t = btn.getAttribute('data-remove-tag');
        d.tags = d.tags.filter(x => x !== t);
        btn.closest('.chip').remove();
        doAutosave();
      };
    });
  }
  wireTagRemovers();

  function wireImageInput(){
    const imgInput = document.getElementById('w-image-input');
    if(!imgInput) return;
    imgInput.addEventListener('change', () => {
      const file = imgInput.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        d.images.push(reader.result);
        refreshImages();
        doAutosave();
      };
      reader.readAsDataURL(file);
    });
  }
  function refreshImages(){
    const wrap = document.getElementById('w-images-list');
    wrap.innerHTML = d.images.map((img,i)=>thumbHtml(img,i)).join('') +
      (d.images.length < 4 ? `<label class="thumb flex items-center justify-center text-2xl cursor-pointer" style="background:var(--bg-soft); color:var(--text-muted);">+<input id="w-image-input" type="file" accept="image/*" class="hidden" /></label>` : '');
    wrap.querySelectorAll('[data-remove-image]').forEach(btn => {
      btn.onclick = () => { d.images.splice(Number(btn.getAttribute('data-remove-image')),1); refreshImages(); doAutosave(); };
    });
    wireImageInput();
  }
  wireImageInput();
  document.getElementById('w-images-list').querySelectorAll('[data-remove-image]').forEach(btn => {
    btn.onclick = () => { d.images.splice(Number(btn.getAttribute('data-remove-image')),1); refreshImages(); doAutosave(); };
  });

  document.getElementById('w-draft').addEventListener('click', () => {
    DB.saveDraft(d);
    showToast('임시 저장했어요 📝');
  });

  document.getElementById('w-cancel').addEventListener('click', () => {
    showModal({
      title:'작성을 취소할까요?',
      body:'저장하지 않은 내용은 사라져요.',
      confirmLabel:'취소하기',
      danger:true,
      onConfirm: () => { nav(state.isEditing ? 'detail' : 'home', state.isEditing ? {entryId:d.id} : {}); }
    });
  });

  const saveBtn = document.getElementById('w-save');
  saveBtn.addEventListener('click', saveEntry);

  async function saveEntry(){
    if(!d.title.trim() && !d.content.trim()){
      showToast('내용을 입력해주세요 ✏️');
      return;
    }
    if(state.saving) return;
    state.saving = true;
    saveBtn.disabled = true;
    saveBtn.textContent = '저장 중…';
    d.updatedAt = new Date().toISOString();
    try{
      let saved;
      const idx = state.entries.findIndex(e => e.id === d.id);
      if(idx >= 0){
        saved = await DB.updateEntry(d, state.userId);
        state.entries[idx] = saved;
      } else {
        saved = await DB.insertEntry(d, state.userId);
        state.entries.push(saved);
      }
      DB.clearDraft();
      state.saving = false;
      showToast('일기를 저장했어요 🌿');
      nav('detail', { entryId: saved.id });
    }catch(err){
      console.error(err);
      state.saving = false;
      saveBtn.disabled = false;
      saveBtn.textContent = '일기 저장';
      showToast('저장에 실패했어요: ' + (err && err.message ? err.message : '알 수 없는 오류'));
    }
  }

  function keyHandler(e){
    if(e.key === 'Escape'){ document.getElementById('w-cancel').click(); }
    if((e.ctrlKey || e.metaKey) && e.key === 's'){ e.preventDefault(); document.getElementById('w-draft').click(); }
  }
  document.removeEventListener('keydown', window.__writeKeyHandler || (()=>{}));
  window.__writeKeyHandler = keyHandler;
  document.addEventListener('keydown', keyHandler);
}

/* ============================================================
   내 일기 (목록 / 캘린더)

function renderList(){
  const allTags = Array.from(new Set(state.entries.flatMap(e => e.tags||[]))).sort();
  const html = `
    <section class="fade-in pb-10">
      <div class="flex items-center justify-between mb-5">
        <h1 class="font-hand text-3xl" style="color:var(--text)">내 일기</h1>
        <div class="flex gap-1 p-1 rounded-full" style="background:var(--bg-soft);">
          <button id="mode-list" class="text-sm px-3 py-1.5 rounded-full ${state.listMode==='list'?'font-semibold':''}" style="background:${state.listMode==='list'?'var(--surface)':'transparent'}; color:var(--text); box-shadow:${state.listMode==='list'?'var(--shadow-sm)':'none'};">목록</button>
          <button id="mode-cal" class="text-sm px-3 py-1.5 rounded-full ${state.listMode==='calendar'?'font-semibold':''}" style="background:${state.listMode==='calendar'?'var(--surface)':'transparent'}; color:var(--text); box-shadow:${state.listMode==='calendar'?'var(--shadow-sm)':'none'};">캘린더</button>
        </div>
      </div>

      ${state.listMode === 'list' ? `
        <div class="grid sm:grid-cols-2 gap-3 mb-4">
          <input id="search-title" type="text" placeholder="🔎 제목 검색" value="${escapeHtml(state.listSearchTitle)}"
            class="px-4 py-2.5 text-sm" style="background:var(--surface); border:1px solid var(--border-soft); border-radius:999px; color:var(--text);" />
          <input id="search-content" type="text" placeholder="🔎 내용 검색" value="${escapeHtml(state.listSearchContent)}"
            class="px-4 py-2.5 text-sm" style="background:var(--surface); border:1px solid var(--border-soft); border-radius:999px; color:var(--text);" />
        </div>
        <div class="flex flex-wrap gap-2 mb-6">
          <select id="filter-mood" class="text-sm px-3 py-2 rounded-full" style="background:var(--bg-soft); border:1px solid var(--border-soft); color:var(--text);">
            <option value="">감정 전체</option>
            ${MOODS.map(m=>`<option value="${m.key}" ${state.listMoodFilter===m.key?'selected':''}>${m.emoji} ${m.label}</option>`).join('')}
          </select>
          <select id="filter-tag" class="text-sm px-3 py-2 rounded-full" style="background:var(--bg-soft); border:1px solid var(--border-soft); color:var(--text);">
            <option value="">태그 전체</option>
            ${allTags.map(t=>`<option value="${escapeHtml(t)}" ${state.listTagFilter===t?'selected':''}>#${escapeHtml(t)}</option>`).join('')}
          </select>
          <select id="sort-order" class="text-sm px-3 py-2 rounded-full" style="background:var(--bg-soft); border:1px solid var(--border-soft); color:var(--text);">
            <option value="newest" ${state.listSort==='newest'?'selected':''}>최신순</option>
            <option value="oldest" ${state.listSort==='oldest'?'selected':''}>오래된순</option>
          </select>
        </div>
        <div id="entries-results"></div>
      ` : `
        <div id="calendar-wrap"></div>
      `}
    </section>
  `;
  renderShell(html);

  if(state.listMode === 'list'){
    document.getElementById('search-title').addEventListener('input', (e) => { state.listSearchTitle = e.target.value; renderListResults(); });
    document.getElementById('search-content').addEventListener('input', (e) => { state.listSearchContent = e.target.value; renderListResults(); });
    document.getElementById('filter-mood').addEventListener('change', (e) => { state.listMoodFilter = e.target.value; renderListResults(); });
    document.getElementById('filter-tag').addEventListener('change', (e) => { state.listTagFilter = e.target.value; renderListResults(); });
    document.getElementById('sort-order').addEventListener('change', (e) => { state.listSort = e.target.value; renderListResults(); });
    renderListResults();
  } else {
    renderCalendar();
  }
  document.getElementById('mode-list').addEventListener('click', () => { state.listMode='list'; renderList(); });
  document.getElementById('mode-cal').addEventListener('click', () => { state.listMode='calendar'; renderList(); });
}

function getFilteredEntries(){
  let list = [...state.entries];
  if(state.listSearchTitle.trim()) list = list.filter(e => (e.title||'').toLowerCase().includes(state.listSearchTitle.trim().toLowerCase()));
  if(state.listSearchContent.trim()) list = list.filter(e => (e.content||'').toLowerCase().includes(state.listSearchContent.trim().toLowerCase()));
  if(state.listMoodFilter) list = list.filter(e => e.mood === state.listMoodFilter);
  if(state.listTagFilter) list = list.filter(e => (e.tags||[]).includes(state.listTagFilter));
  list.sort((a,b) => state.listSort === 'newest'
    ? (b.date+b.createdAt).localeCompare(a.date+a.createdAt)
    : (a.date+a.createdAt).localeCompare(b.date+b.createdAt));
  return list;
}

function renderListResults(){
  const container = document.getElementById('entries-results');
  const list = getFilteredEntries();

  if(!list.length){
    container.innerHTML = state.entries.length === 0 ? `
      <div class="text-center py-16">
        <p class="text-3xl mb-3">🌱</p>
        <p class="font-hand text-xl mb-1" style="color:var(--text)">아직 기록이 없어요</p>
        <p class="text-sm" style="color:var(--text-muted)">첫 하루를 기록해보세요.</p>
      </div>` : `
      <div class="text-center py-16">
        <p class="text-3xl mb-3">🔍</p>
        <p class="font-hand text-xl mb-1" style="color:var(--text)">아직 찾으시는 기록이 없어요.</p>
        <p class="text-sm" style="color:var(--text-muted)">새로운 하루를 기록해보세요.</p>
      </div>`;
    return;
  }

  container.innerHTML = `<div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">${list.map(e => entryCardHighlightHtml(e)).join('')}</div>`;
  container.querySelectorAll('.entry-card').forEach(card => {
    card.addEventListener('click', () => nav('detail', { entryId: card.getAttribute('data-id') }));
  });
}

function entryCardHighlightHtml(e){
  const m = moodOf(e.mood), w = weatherOf(e.weather);
  const term = state.listSearchTitle.trim() || state.listSearchContent.trim();
  return `
    <div class="entry-card paper-card p-4 cursor-pointer" data-id="${e.id}">
      <div class="flex items-start justify-between mb-2">
        <div>
          <p class="text-xs" style="color:var(--text-muted)">${formatDateKR(e.date, false)}</p>
          <h3 class="font-semibold text-base mt-0.5" style="color:var(--text)">${highlightText(e.title || '(제목 없음)', term)}</h3>
        </div>
        <span class="mood-dot" style="background:${m?m.color:'var(--accent-gray)'}">${m?m.emoji:'🙂'}</span>
      </div>
      <p class="text-sm mb-3" style="color:var(--text-muted); min-height:2.6em;">${highlightText(truncate(e.content, 70), term)}</p>
      <div class="flex items-center justify-between">
        <div class="flex flex-wrap gap-1">${(e.tags||[]).slice(0,2).map(t=>`<span class="chip !py-0.5 !px-2 text-xs">#${escapeHtml(t)}</span>`).join('')}</div>
        <span class="text-sm">${w?w.emoji:''}</span>
      </div>
    </div>`;
}

/* ---- 캘린더 ---- */
function renderCalendar(){
  const wrap = document.getElementById('calendar-wrap');
  const cursor = state.calendarCursor;
  const year = cursor.getFullYear(), month = cursor.getMonth();
  const firstDay = new Date(year, month, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const entriesByDate = {};
  state.entries.forEach(e => { (entriesByDate[e.date] = entriesByDate[e.date] || []).push(e); });

  let cells = '';
  for(let i=0;i<startWeekday;i++) cells += `<div></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const dateStr = `${year}-${pad2(month+1)}-${pad2(day)}`;
    const dayEntries = entriesByDate[dateStr] || [];
    const isToday = dateStr === todayStr();
    const isSelected = dateStr === state.calendarSelectedDate;
    const dominant = dayEntries[0] ? moodOf(dayEntries[0].mood) : null;
    cells += `
      <div class="cal-cell ${isToday?'today':''} ${dayEntries.length?'has-entry':''} ${isSelected?'selected':''}" data-date="${dateStr}"
        style="background:${dayEntries.length ? (dominant?dominant.color:'var(--bg-soft)') : 'transparent'}; color:${dayEntries.length ? 'var(--text)':'var(--text-muted)'};">
        <span style="font-size:.85rem;">${day}</span>
        ${dayEntries.length ? `<span style="font-size:.7rem;">${dominant?dominant.emoji:''}</span>` : ''}
      </div>`;
  }

  const selectedEntries = state.calendarSelectedDate ? (entriesByDate[state.calendarSelectedDate] || []) : [];

  wrap.innerHTML = `
    <div class="paper-card p-5 mb-5">
      <div class="flex items-center justify-between mb-4">
        <button id="cal-prev" class="btn-ghost !px-3 !py-1.5">‹</button>
        <h3 class="font-hand text-2xl" style="color:var(--text)">${year}년 ${month+1}월</h3>
        <button id="cal-next" class="btn-ghost !px-3 !py-1.5">›</button>
      </div>
      <div class="grid grid-cols-7 gap-1.5 mb-2 text-center text-xs" style="color:var(--text-muted)">
        ${['일','월','화','수','목','금','토'].map(d=>`<div>${d}</div>`).join('')}
      </div>
      <div class="grid grid-cols-7 gap-1.5">${cells}</div>
      <div class="flex flex-wrap gap-3 mt-4 pt-4 text-xs" style="border-top:1px solid var(--border-soft); color:var(--text-muted);">
        ${MOODS.map(m=>`<span class="flex items-center gap-1"><span style="width:9px;height:9px;border-radius:999px;background:${m.color};display:inline-block;"></span>${m.label}</span>`).join('')}
      </div>
    </div>
    <div id="cal-day-detail">
      ${state.calendarSelectedDate ? `
        <h4 class="font-semibold mb-3" style="color:var(--text)">${formatDateKR(state.calendarSelectedDate)}</h4>
        ${selectedEntries.length ? `<div class="grid sm:grid-cols-2 gap-3">${selectedEntries.map(e=>entryCardHtml(e)).join('')}</div>` : `<p class="text-sm" style="color:var(--text-muted)">이 날의 기록이 없어요.</p>`}
      ` : `<p class="text-sm" style="color:var(--text-muted)">날짜를 선택해 그날의 기록을 확인해보세요.</p>`}
    </div>
  `;

  wrap.querySelectorAll('[data-date]').forEach(cell => {
    cell.addEventListener('click', () => { state.calendarSelectedDate = cell.getAttribute('data-date'); renderCalendar(); });
  });
  wrap.querySelectorAll('.entry-card').forEach(card => {
    card.addEventListener('click', () => nav('detail', { entryId: card.getAttribute('data-id') }));
  });
  document.getElementById('cal-prev').addEventListener('click', () => { state.calendarCursor = new Date(year, month-1, 1); renderCalendar(); });
  document.getElementById('cal-next').addEventListener('click', () => { state.calendarCursor = new Date(year, month+1, 1); renderCalendar(); });
}

/* ============================================================
   일기 상세
   ============================================================ */
function renderDetail(){
  const e = state.entries.find(x => x.id === state.entryId);
  if(!e){ nav('list'); return; }
  const m = moodOf(e.mood), w = weatherOf(e.weather);
  const html = `
    <section class="fade-in max-w-2xl mx-auto pb-10">
      <button id="back-btn" class="text-sm mb-5" style="color:var(--text-muted)">← 목록으로</button>
      <div class="paper-card p-6 sm:p-8">
        <div class="flex items-start justify-between mb-4">
          <div>
            <p class="text-sm" style="color:var(--text-muted)">${formatDateKR(e.date)}</p>
            <h1 class="font-hand text-3xl mt-1" style="color:var(--text)">${escapeHtml(e.title || '(제목 없음)')}</h1>
          </div>
          <span class="mood-dot" style="width:46px;height:46px;font-size:24px;background:${m?m.color:'var(--accent-gray)'}">${m?m.emoji:'🙂'}</span>
        </div>
        <div class="flex flex-wrap items-center gap-3 mb-6 text-sm" style="color:var(--text-muted)">
          ${w ? `<span>${w.emoji} ${w.label}</span>` : ''}
          ${m ? `<span>· ${m.label}</span>` : ''}
          <span>· 마지막 수정 ${formatDateTimeKR(e.updatedAt)}</span>
        </div>
        <p class="whitespace-pre-wrap leading-8 mb-6" style="color:var(--text);">${escapeHtml(e.content)}</p>
        ${e.images && e.images.length ? `<div class="flex flex-wrap gap-2 mb-6">${e.images.map(img=>`<img src="${img}" class="w-28 h-28 rounded-xl object-cover" style="border:1px solid var(--border-soft);"/>`).join('')}</div>` : ''}
        ${e.tags && e.tags.length ? `<div class="flex flex-wrap gap-2 mb-6">${e.tags.map(t=>`<span class="chip">#${escapeHtml(t)}</span>`).join('')}</div>` : ''}
        <div class="stitch mb-6"></div>
        <div class="flex gap-2">
          <button id="edit-btn" class="btn-ghost">✏️ 수정</button>
          <button id="delete-btn" class="btn-ghost" style="color:var(--accent-red);">🗑 삭제</button>
        </div>
      </div>
    </section>
  `;
  renderShell(html);
  document.getElementById('back-btn').addEventListener('click', () => nav('list'));
  document.getElementById('edit-btn').addEventListener('click', () => beginWrite(e.id));
  document.getElementById('delete-btn').addEventListener('click', () => {
    showModal({
      title:'이 일기를 삭제할까요?',
      body:'삭제한 일기는 다시 되돌릴 수 없어요.',
      confirmLabel:'삭제하기',
      danger:true,
      onConfirm: async () => {
        try{
          await DB.deleteEntry(e.id);
          state.entries = state.entries.filter(x => x.id !== e.id);
          showToast('일기를 삭제했어요');
          nav('list');
        }catch(err){
          console.error(err);
          showToast('삭제에 실패했어요: ' + (err && err.message ? err.message : '알 수 없는 오류'));
        }
      }
    });
  });
}

/* ============================================================
   감정 통계
   ============================================================ */
function renderStats(){
  const now = new Date();
  const thisMonthEntries = state.entries.filter(e => {
    const [y,m] = e.date.split('-').map(Number);
    return y === now.getFullYear() && (m-1) === now.getMonth();
  });
  const moodCounts = {};
  MOODS.forEach(m => moodCounts[m.key] = 0);
  thisMonthEntries.forEach(e => { if(e.mood) moodCounts[e.mood] = (moodCounts[e.mood]||0)+1; });
  const maxCount = Math.max(1, ...Object.values(moodCounts));
  let topMoodKey = null, topVal = -1;
  Object.entries(moodCounts).forEach(([k,v]) => { if(v > topVal){ topVal = v; topMoodKey = k; } });
  const topMood = topVal > 0 ? moodOf(topMoodKey) : null;

  // 최근 7일
  const last7 = [];
  for(let i=6;i>=0;i--){
    const dt = new Date(now); dt.setDate(dt.getDate()-i);
    const ds = toDateStr(dt);
    const dayEntries = state.entries.filter(e => e.date === ds);
    last7.push({ date: ds, entry: dayEntries[0] || null, weekday: ['일','월','화','수','목','금','토'][dt.getDay()] });
  }

  // 월별 (올해)
  const monthlyCounts = Array(12).fill(0);
  state.entries.forEach(e => {
    const [y,m] = e.date.split('-').map(Number);
    if(y === now.getFullYear()) monthlyCounts[m-1]++;
  });
  const maxMonthly = Math.max(1, ...monthlyCounts);

  const html = `
    <section class="fade-in pb-10">
      <h1 class="font-hand text-3xl mb-6" style="color:var(--text)">감정 통계</h1>

      <div class="grid sm:grid-cols-2 gap-4 mb-8">
        <div class="paper-card p-5">
          <p class="text-sm mb-1" style="color:var(--text-muted)">이번 달 작성한 일기</p>
          <p class="font-hand text-4xl" style="color:var(--text)">${thisMonthEntries.length}<span class="text-lg font-sans">개</span></p>
        </div>
        <div class="paper-card p-5">
          <p class="text-sm mb-1" style="color:var(--text-muted)">가장 많이 느낀 감정</p>
          <p class="font-hand text-4xl" style="color:var(--text)">${topMood ? `${topMood.emoji} ${topMood.label}` : '기록 없음'}</p>
        </div>
      </div>

      <div class="paper-card p-5 mb-8">
        <h3 class="font-semibold mb-4" style="color:var(--text)">감정별 작성 횟수 (이번 달)</h3>
        <div class="space-y-3">
          ${MOODS.map(m => `
            <div class="flex items-center gap-3">
              <span class="w-16 text-sm flex items-center gap-1" style="color:var(--text-muted)">${m.emoji} ${m.label}</span>
              <div class="bar-track flex-1 h-3"><div class="bar-fill" style="width:${(moodCounts[m.key]/maxCount)*100}%; background:${m.color};"></div></div>
              <span class="w-6 text-right text-sm" style="color:var(--text-muted)">${moodCounts[m.key]}</span>
            </div>`).join('')}
        </div>
      </div>

      <div class="paper-card p-5 mb-8">
        <h3 class="font-semibold mb-4" style="color:var(--text)">최근 7일 감정 변화</h3>
        <div class="flex justify-between gap-1">
          ${last7.map(d => {
            const m = d.entry ? moodOf(d.entry.mood) : null;
            return `<div class="flex flex-col items-center gap-1.5 flex-1">
              <div class="w-9 h-9 rounded-full flex items-center justify-center text-base" style="background:${m?m.color:'var(--bg-soft)'};">${m?m.emoji:'·'}</div>
              <span class="text-xs" style="color:var(--text-muted)">${d.weekday}</span>
            </div>`;
          }).join('')}
        </div>
      </div>

      <div class="paper-card p-5">
        <h3 class="font-semibold mb-4" style="color:var(--text)">월별 감정 변화 (${now.getFullYear()}년)</h3>
        <div class="flex items-end gap-2" style="height:120px;">
          ${monthlyCounts.map((c,i) => `
            <div class="flex-1 flex flex-col items-center justify-end gap-1">
              <span class="text-[10px]" style="color:var(--text-muted)">${c||''}</span>
              <div class="w-full rounded-t-md" style="height:${(c/maxMonthly)*90}px; min-height:${c>0?'4px':'0'}; background:${i===now.getMonth()?'var(--accent-pink)':'var(--accent-blue)'};"></div>
              <span class="text-[10px]" style="color:var(--text-muted)">${i+1}월</span>
            </div>`).join('')}
        </div>
      </div>
    </section>
  `;
  renderShell(html);
}

/* ---------------- 전역 단축키 ---------------- */
document.addEventListener('keydown', (e) => {
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  const typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
  if(typing) return;
  if(e.key === 'd' || e.key === 'D'){ toggleTheme(); }
  if(e.key === 'n' || e.key === 'N'){ beginWrite(); }
  if(e.key === 'h' || e.key === 'H'){ nav('home'); }
  if(e.key === 'l' || e.key === 'L'){ nav('list'); }
});

/* ---------------- 초기 실행 ---------------- */
boot();
</script>
</body>
</html>
