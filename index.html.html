function initTravelMap(){
  const container = document.getElementById('travel-map');
  if(!container) return;
  if(travelMap){ travelMap.remove(); travelMap = null; }
  travelMap = L.map(container, { zoomControl:true }).setView([20,10], 2);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom:19, attribution:'&copy; OpenStreetMap contributors'
  }).addTo(travelMap);
  travelMarkersLayer = L.layerGroup().addTo(travelMap);
  travelRouteLayer = L.layerGroup().addTo(travelMap);
  travelMap.on('click', (e) => openTravelPinForm({ lat:e.latlng.lat, lng:e.latlng.lng }));
  renderTravelMarkers();
  if(state.travelDateFilter) drawTravelRoute();
}

function renderTravelMarkers(){
  if(!travelMarkersLayer) return;
  travelMarkersLayer.clearLayers();
  const list = getFilteredTravelPins();
  list.forEach(p => {
    if(typeof p.lat !== 'number' || typeof p.lng !== 'number') return;
    const cat = travelCategoryOf(p.category);
    const icon = L.divIcon({ className:'', html:`<div style="font-size:22px; transform:translate(-50%,-100%); filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));">${cat?cat.emoji:'📍'}</div>`, iconSize:[0,0] });
    const marker = L.marker([p.lat,p.lng], { icon }).addTo(travelMarkersLayer);
    marker.bindPopup(travelPopupHtml(p));
    marker.on('popupopen', () => wireTravelPopup(p.id));
    marker._travelId = p.id;
  });
  if(!state.travelDateFilter && list.length){
    const bounds = L.latLngBounds(list.filter(p=>typeof p.lat==='number').map(p=>[p.lat,p.lng]));
    if(bounds.isValid()) travelMap.fitBounds(bounds.pad(0.3), { maxZoom:9 });
  }
}

}
function wireTravelPopup(id){
  setTimeout(() => {
    document.querySelector(`[data-popup-edit="${id}"]`)?.addEventListener('click', () => openTravelPinForm(null, id));
    document.querySelector(`[data-popup-del="${id}"]`)?.addEventListener('click', () => {
      showModal({ title:'이 기록을 삭제할까요?', body:'삭제한 기록은 되돌릴 수 없어요.', confirmLabel:'삭제하기', danger:true,
        onConfirm: async () => {
          try{
            await DB.deleteTravelPin(id);
            state.travelPins = state.travelPins.filter(p=>p.id!==id);
            travelMap.closePopup();
            showToast('기록을 삭제했어요');
            renderTravelMarkers(); renderTravelPinList();
          }catch(err){ console.error(err); showToast('삭제에 실패했어요'); }

function focusTravelPin(id){
  if(!travelMap || !travelMarkersLayer) return;
  let target=null;
  travelMarkersLayer.eachLayer(m => { if(m._travelId === id) target = m; });
  const p = state.travelPins.find(x=>x.id===id);
  if(target && p){
    travelMap.flyTo([p.lat,p.lng], Math.max(travelMap.getZoom(), 12), { duration:0.6 });
    setTimeout(()=>target.openPopup(), 350);
  }
}

async function performTravelSearch(query){
  if(!query.trim()) return;
  const resultsEl = document.getElementById('travel-search-results');
  if(resultsEl) resultsEl.innerHTML = `<span class="text-xs" style="color:var(--text-muted)">검색 중…</span>`;
  try{
    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=5&q=${encodeURIComponent(query)}`);
    state.travelSearchResults = (await res.json()) || [];
  }catch(err){
    console.error(err); state.travelSearchResults = [];
    showToast('검색에 실패했어요');
  }
  renderTravelSearchResults();
}
function renderTravelSearchResults(){
  const el = document.getElementById('travel-search-results');
  if(!el) return;
  if(!state.travelSearchResults.length){ el.innerHTML=''; return; }
  el.innerHTML = state.travelSearchResults.map((r,i) => `<button type="button" class="chip" data-search-result="${i}">📍 ${escapeHtml(truncate(r.display_name,40))}</button>`).join('');
  el.querySelectorAll('[data-search-result]').forEach(btn => {
    btn.addEventListener('click', () => {
      const r = state.travelSearchResults[Number(btn.getAttribute('data-search-result'))];
      if(!r || !travelMap) return;
      travelMap.flyTo([Number(r.lat), Number(r.lon)], 18, {
  duration: 1.2
});
      state.travelSearchResults = []; el.innerHTML = '';
    });
  });
}

function drawTravelRoute(){
  if(!travelRouteLayer) return;
  travelRouteLayer.clearLayers();
  if(!state.travelDateFilter) return;
  const pins = getFilteredTravelPins()
    .filter(p => typeof p.lat==='number' && typeof p.lng==='number')
    .sort((a,b) => (a.visitTime||'').localeCompare(b.visitTime||'') || (a.createdAt||'').localeCompare(b.createdAt||''));
  if(!pins.length) return;
  if(pins.length >= 2){
    const line = L.polyline(pins.map(p=>[p.lat,p.lng]), { color:'#FF8FB8', weight:4, opacity:0.85, dashArray:'6 8' }).addTo(travelRouteLayer);
    pins.forEach((p,i) => {
      const numIcon = L.divIcon({ className:'', html:`<div style="background:#233432;color:#fff;font-size:11px;font-weight:700;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 4px rgba(0,0,0,.3);">${i+1}</div>`, iconSize:[20,20] });
      L.marker([p.lat,p.lng], { icon:numIcon, zIndexOffset:1000 }).addTo(travelRouteLayer);
    });
    travelMap.fitBounds(line.getBounds().pad(0.35), { maxZoom:14 });
  } else {
    travelMap.flyTo([pins[0].lat,pins[0].lng], 13, { duration:0.6 });
  }
}

function wireTravelMapControls(){
  document.getElementById('travel-search-btn')?.addEventListener('click', () => {
    state.travelSearchQuery = document.getElementById('travel-search-input').value;
    performTravelSearch(state.travelSearchQuery);

}

async function openTravelPinForm(latlng, editId){
  let draft;
  if(editId){
    const src = state.travelPins.find(p=>p.id===editId);
    if(!src) return;
    draft = JSON.parse(JSON.stringify(src));
  } else {
    draft = {
      id:newId(), name:'', category:'attraction', lat:latlng.lat, lng:latlng.lng,
      address:'', visitDate:todayStr(), visitTime:'', review:'', photos:[],
      createdAt:new Date().toISOString(), updatedAt:new Date().toISOString(),
    };
    try{
      const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latlng.lat}&lon=${latlng.lng}`);
      const data = await res.json();
      if(data && data.display_name){ draft.address = data.display_name; draft.name = data.display_name.split(',')[0]; }
    }catch(err){ console.error(err); }
  }
  state.travelDraft = draft;
  renderTravelPinFormPanel();
  document.getElementById('travel-pin-form-wrap')?.scrollIntoView({ behavior:'smooth', block:'center' });
}

function wireTravelPinForm(){
  const d = state.travelDraft;
  document.querySelectorAll('#tp-cat-row [data-tp-cat]').forEach(btn => {
    btn.addEventListener('click', () => {
      d.category = btn.getAttribute('data-tp-cat');
      document.querySelectorAll('#tp-cat-row .travel-cat-pick').forEach(b => b.classList.toggle('selected', b.getAttribute('data-tp-cat')===d.category));
    });
  });
  function refreshImages(){
    const wrap = document.getElementById('tp-images-list');
    wrap.innerHTML = d.photos.map((img,i)=>thumbHtml(img,i)).join('') +
      (d.photos.length < 4 ? `<label class="thumb flex items-center justify-center text-2xl cursor-pointer" style="background:var(--bg-soft); color:var(--text-muted);">+<input id="tp-image-input" type="file" accept="image/*" class="hidden" /></label>` : '');
    wrap.querySelectorAll('[data-remove-image]').forEach(btn => { btn.onclick = () => { d.photos.splice(Number(btn.getAttribute('data-remove-image')),1); refreshImages(); }; });
    wireImgInput();
  }
  function wireImgInput(){
    const imgInput = document.getElementById('tp-image-input');
    if(!imgInput) return;
    imgInput.addEventListener('change', () => {
      const file = imgInput.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = () => { d.photos.push(reader.result); refreshImages(); };
      reader.readAsDataURL(file);
    });
  }
  wireImgInput();
  document.getElementById('tp-images-list').querySelectorAll('[data-remove-image]').forEach(btn => { btn.onclick = () => { d.photos.splice(Number(btn.getAttribute('data-remove-image')),1); refreshImages(); }; });

  document.getElementById('tp-cancel').addEventListener('click', () => { state.travelDraft = null; renderTravelPinFormPanel(); });

  document.getElementById('tp-save').addEventListener('click', async () => {
    d.name = document.getElementById('tp-name').value.trim();
    d.visitDate = document.getElementById('tp-date').value;
    d.visitTime = document.getElementById('tp-time').value;
    d.review = document.getElementById('tp-review').value;
    if(!d.name){ showToast('장소 이름을 입력해주세요 ✏️'); return; }
    d.updatedAt = new Date().toISOString();
    const saveBtn = document.getElementById('tp-save');
    saveBtn.disabled = true; saveBtn.textContent = '저장 중…';
    try{
      const idx = state.travelPins.findIndex(p=>p.id===d.id);
      let saved;
      if(idx >= 0){ saved = await DB.updateTravelPin(d, state.userId); state.travelPins[idx]=saved; }
      else { saved = await DB.insertTravelPin(d, state.userId); state.travelPins.push(saved); }
      state.travelDraft = null;
      showToast('여행 기록을 저장했어요 🗺️');
      renderTravelPinFormPanel();
      renderTravelMarkers(); renderTravelPinList();
      if(state.travelDateFilter) drawTravelRoute();
    }catch(err){
      console.error(err);
      showToast('저장에 실패했어요: ' + (err && err.message ? err.message : '알 수 없는 오류'));
      saveBtn.disabled=false; saveBtn.textContent='저장하기';
    }
  });
}

/* ---- 캘린더 ---- */
function renderCalendar(){
  const wrap = document.getElementById('calendar-wrap');
  const cursor = state.calendarCursor;
  const year = cursor.getFullYear(), month = cursor.getMonth();
  const firstDay = new Date(year, month, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const entriesByDate = {};
  state.entries.forEach(e => { (entriesByDate[e.date] = entriesByDate[e.date] || []).push(e); });

  let cells = '';
  for(let i=0;i<startWeekday;i++) cells += `<div></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const dateStr = `${year}-${pad2(month+1)}-${pad2(day)}`;
    const dayEntries = entriesByDate[dateStr] || [];
    const isToday = dateStr === todayStr();
    const isSelected = dateStr === state.calendarSelectedDate;
    const dominant = dayEntries[0] ? moodOf(dayEntries[0].mood) : null;
    cells += `
      <div class="cal-cell ${isToday?'today':''} ${dayEntries.length?'has-entry':''} ${isSelected?'selected':''}" data-date="${dateStr}"
        style="background:${dayEntries.length ? (dominant?dominant.color:'var(--bg-soft)') : 'transparent'}; color:${dayEntries.length ? 'var(--text)':'var(--text-muted)'};">
        <span style="font-size:.85rem;">${day}</span>
        ${dayEntries.length ? `<span style="font-size:.7rem;">${dominant?dominant.emoji:''}</span>` : ''}
      </div>`;
  }

  const selectedEntries = state.calendarSelectedDate ? (entriesByDate[state.calendarSelectedDate] || []) : [];

  wrap.innerHTML = `
    <div class="paper-card p-5 mb-5">
      <div class="flex items-center justify-between mb-4">
        <button id="cal-prev" class="btn-ghost !px-3 !py-1.5">‹</button>
        <h3 class="font-hand text-2xl" style="color:var(--text)">${year}년 ${month+1}월</h3>
        <button id="cal-next" class="btn-ghost !px-3 !py-1.5">›</button>
      </div>
      <div class="grid grid-cols-7 gap-1.5 mb-2 text-center text-xs" style="color:var(--text-muted)">
        ${['일','월','화','수','목','금','토'].map(d=>`<div>${d}</div>`).join('')}
      </div>
      <div class="grid grid-cols-7 gap-1.5">${cells}</div>
      <div class="flex flex-wrap gap-3 mt-4 pt-4 text-xs" style="border-top:1px solid var(--border-soft); color:var(--text-muted);">
        ${MOODS.map(m=>`<span class="flex items-center gap-1"><span style="width:9px;height:9px;border-radius:999px;background:${m.color};display:inline-block;"></span>${m.label}</span>`).join('')}
      </div>
    </div>
    <div id="cal-day-detail">
      ${state.calendarSelectedDate ? `
        <div class="paper-card p-5 mb-5">
          <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
            <div>
              <h4 class="font-semibold" style="color:var(--text)">${formatDateKR(state.calendarSelectedDate)}</h4>
              <p class="text-xs mt-1" style="color:var(--text-muted)">이 날짜에 남기고 싶은 기록을 선택하세요.</p>
            </div>
            <div class="flex gap-2">
              <button id="cal-add-diary" type="button" class="btn-ghost text-sm">✍️ 일기 쓰기</button>
              <button id="cal-add-todo" type="button" class="text-sm px-4 py-2 rounded-full font-semibold" style="background:var(--text); color:var(--bg);">✓ 할 일 추가</button>
            </div>
          </div>
          ${selectedEntries.length ? `<div class="grid sm:grid-cols-2 gap-3">${selectedEntries.map(e=>entryCardHtml(e)).join('')}</div>` : `<p class="text-sm" style="color:var(--text-muted)">이 날에는 아직 일기가 없어요.</p>`}
        </div>
        <div class="paper-card p-5">
          <div class="flex items-center justify-between mb-3">
            <h4 class="font-semibold" style="color:var(--text)">할 일</h4>
            <span class="text-xs" style="color:var(--text-muted)">진행중 △ · 완료 ○ · 실패 ✕</span>
          </div>
          <div class="space-y-1.5 mb-3" data-todo-list="${state.calendarSelectedDate}">
            ${((state.todos && state.todos[state.calendarSelectedDate]) || []).length ? ((state.todos[state.calendarSelectedDate] || []).map(it=>todoItemHtml(state.calendarSelectedDate,it)).join('')) : `<p class="text-xs" style="color:var(--text-muted)">등록된 할 일이 없어요.</p>`}
          </div>
          <div class="flex gap-2">
            <input type="text" class="todo-new-input flex-1 text-sm px-3 py-2 rounded-xl" data-todo-new="${state.calendarSelectedDate}" placeholder="할 일을 입력해주세요" style="background:var(--bg-soft); border:1px solid var(--border-soft); color:var(--text);" />

          </div>
        </div>
      ` : `<p class="text-sm" style="color:var(--text-muted)">날짜를 선택해 그날의 기록을 확인하고 추가해보세요.</p>`}
    </div>
  `;

  wrap.querySelectorAll('[data-date]').forEach(cell => {
    cell.addEventListener('click', () => { state.calendarSelectedDate = cell.getAttribute('data-date'); renderCalendar(); });
  });
  wrap.querySelectorAll('.entry-card').forEach(card => {
    card.addEventListener('click', () => nav('detail', { entryId: card.getAttribute('data-id') }));

  document.getElementById('cal-add-diary')?.addEventListener('click', () => beginWriteForDate(state.calendarSelectedDate));
  document.getElementById('cal-add-todo')?.addEventListener('click', () => {
    document.querySelector(`[data-todo-new="${state.calendarSelectedDate}"]`)?.focus();
  });
  wireTodoWidgets();
  document.getElementById('cal-prev').addEventListener('click', () => { state.calendarCursor = new Date(year, month-1, 1); renderCalendar(); });
  document.getElementById('cal-next').addEventListener('click', () => { state.calendarCursor = new Date(year, month+1, 1); renderCalendar(); });
}

  const html = `
    <section class="fade-in max-w-2xl mx-auto pb-10">
      <button id="back-btn" class="text-sm mb-5" style="color:var(--text-muted)">← 목록으로</button>
      <div class="paper-card p-6 sm:p-8">
        <div class="flex items-start justify-between mb-4">
          <div>
            <p class="text-sm" style="color:var(--text-muted)">${formatDateKR(e.date)}</p>
            <h1 class="font-hand text-3xl mt-1" style="color:var(--text)">${escapeHtml(e.title || '(제목 없음)')}</h1>
          </div>
          <span class="mood-dot" style="width:46px;height:46px;font-size:24px;background:${m?m.color:'var(--accent-gray)'}">${m?m.emoji:'🙂'}</span>
        </div>
        <div class="flex flex-wrap items-center gap-3 mb-6 text-sm" style="color:var(--text-muted)">
          ${w ? `<span>${w.emoji} ${w.label}</span>` : ''}
          ${m ? `<span>· ${m.label}</span>` : ''}
          <span>· 마지막 수정 ${formatDateTimeKR(e.updatedAt)}</span>
        </div>
        <p class="whitespace-pre-wrap leading-8 mb-6" style="color:var(--text);">${escapeHtml(e.content)}</p>
        ${e.images && e.images.length ? `<div class="flex flex-wrap gap-2 mb-6">${e.images.map(img=>`<img src="${img}" class="w-48 h-48 rounded-xl object-cover" style="border:1px solid var(--border-soft);"/>`).join('')}</div>` : ''}
        ${e.tags && e.tags.length ? `<div class="flex flex-wrap gap-2 mb-6">${e.tags.map(t=>`<span class="chip">#${escapeHtml(t)}</span>`).join('')}</div>` : ''}
        <div class="stitch mb-6"></div>
        <div class="flex gap-2">
          <button id="edit-btn" class="btn-ghost">✏️ 수정</button>
          <button id="delete-btn" class="btn-ghost" style="color:var(--accent-red);">🗑 삭제</button>
        </div>
      </div>
    </section>
  `;
  renderShell(html);
  document.getElementById('back-btn').addEventListener('click', () => nav('list'));
  document.getElementById('edit-btn').addEventListener('click', () => beginWrite(e.id));
  document.getElementById('delete-btn').addEventListener('click', () => {
    showModal({
      title:'이 일기를 삭제할까요?',
      body:'삭제한 일기는 다시 되돌릴 수 없어요.',
      confirmLabel:'삭제하기',
      danger:true,
      onConfirm: async () => {
        try{
          await DB.deleteEntry(e.id);
          state.entries = state.entries.filter(x => x.id !== e.id);
          showToast('일기를 삭제했어요');
          nav('list');
        }catch(err){
          console.error(err);
          showToast('삭제에 실패했어요: ' + (err && err.message ? err.message : '알 수 없는 오류'));
        }
      }
    });
  });
}

/* ============================================================
   감정 통계
   ============================================================ */
function renderStats(){
  const now = new Date();
  const thisMonthEntries = state.entries.filter(e => {
    const [y,m] = e.date.split('-').map(Number);
    return y === now.getFullYear() && (m-1) === now.getMonth();
  });
  const moodCounts = {};
  MOODS.forEach(m => moodCounts[m.key] = 0);
  thisMonthEntries.forEach(e => { if(e.mood) moodCounts[e.mood] = (moodCounts[e.mood]||0)+1; });
  const maxCount = Math.max(1, ...Object.values(moodCounts));
  let topMoodKey = null, topVal = -1;
  Object.entries(moodCounts).forEach(([k,v]) => { if(v > topVal){ topVal = v; topMoodKey = k; } });
  const topMood = topVal > 0 ? moodOf(topMoodKey) : null;

  // 최근 7일
  const last7 = [];
  for(let i=6;i>=0;i--){
    const dt = new Date(now); dt.setDate(dt.getDate()-i);
    const ds = toDateStr(dt);
    const dayEntries = state.entries.filter(e => e.date === ds);
    last7.push({ date: ds, entry: dayEntries[0] || null, weekday: ['일','월','화','수','목','금','토'][dt.getDay()] });
  }

  // 월별 (올해)
  const monthlyCounts = Array(12).fill(0);
  state.entries.forEach(e => {
    const [y,m] = e.date.split('-').map(Number);
    if(y === now.getFullYear()) monthlyCounts[m-1]++;
  });
  const maxMonthly = Math.max(1, ...monthlyCounts);

  const html = `
    <section class="fade-in pb-10">
      <h1 class="font-hand text-3xl mb-6" style="color:var(--text)">감정 통계</h1>

      <div class="grid sm:grid-cols-2 gap-4 mb-8">
        <div class="paper-card p-5">
          <p class="text-sm mb-1" style="color:var(--text-muted)">이번 달 작성한 일기</p>
          <p class="font-hand text-4xl" style="color:var(--text)">${thisMonthEntries.length}<span class="text-lg font-sans">개</span></p>
        </div>
        <div class="paper-card p-5">
          <p class="text-sm mb-1" style="color:var(--text-muted)">가장 많이 느낀 감정</p>
          <p class="font-hand text-4xl" style="color:var(--text)">${topMood ? `${topMood.emoji} ${topMood.label}` : '기록 없음'}</p>
        </div>
      </div>

      <div class="paper-card p-5 mb-8">
        <h3 class="font-semibold mb-4" style="color:var(--text)">감정별 작성 횟수 (이번 달)</h3>
        <div class="space-y-3">
          ${MOODS.map(m => `
            <div class="flex items-center gap-3">
              <span class="w-16 text-sm flex items-center gap-1" style="color:var(--text-muted)">${m.emoji} ${m.label}</span>
              <div class="bar-track flex-1 h-3"><div class="bar-fill" style="width:${(moodCounts[m.key]/maxCount)*100}%; background:${m.color};"></div></div>
              <span class="w-6 text-right text-sm" style="color:var(--text-muted)">${moodCounts[m.key]}</span>
            </div>`).join('')}
        </div>
      </div>

      <div class="paper-card p-5 mb-8">
        <h3 class="font-semibold mb-4" style="color:var(--text)">최근 7일 감정 변화</h3>
        <div class="flex justify-between gap-1">
          ${last7.map(d => {
            const m = d.entry ? moodOf(d.entry.mood) : null;
            return `<div class="flex flex-col items-center gap-1.5 flex-1">
              <div class="w-9 h-9 rounded-full flex items-center justify-center text-base" style="background:${m?m.color:'var(--bg-soft)'};">${m?m.emoji:'·'}</div>
              <span class="text-xs" style="color:var(--text-muted)">${d.weekday}</span>
            </div>`;
          }).join('')}
        </div>
      </div>

      <div class="paper-card p-5">
        <h3 class="font-semibold mb-4" style="color:var(--text)">월별 감정 변화 (${now.getFullYear()}년)</h3>
        <div class="flex items-end gap-2" style="height:120px;">
          ${monthlyCounts.map((c,i) => `
            <div class="flex-1 flex flex-col items-center justify-end gap-1">
              <span class="text-[10px]" style="color:var(--text-muted)">${c||''}</span>
              <div class="w-full rounded-t-md" style="height:${(c/maxMonthly)*90}px; min-height:${c>0?'4px':'0'}; background:${i===now.getMonth()?'var(--accent-pink)':'var(--accent-blue)'};"></div>
              <span class="text-[10px]" style="color:var(--text-muted)">${i+1}월</span>
            </div>`).join('')}
        </div>
      </div>
    </section>
  `;
  renderShell(html);
}

/* ---------------- 전역 단축키 ---------------- */
document.addEventListener('keydown', (e) => {
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  const typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
  if(typing) return;
  if(e.key === 'd' || e.key === 'D'){ toggleTheme(); }
  if(e.key === 'n' || e.key === 'N'){ beginWrite(); }
  if(e.key === 'h' || e.key === 'H'){ nav('home'); }
  if(e.key === 'l' || e.key === 'L'){ nav('list'); }
  if(e.key === 'c' || e.key === 'C'){ nav('calendar'); }
  if(e.key === 'f' || e.key === 'F'){ nav('fortune'); }
});

/* ---------------- 초기 실행 ---------------- */
boot();
</script>
</body>
</html>
